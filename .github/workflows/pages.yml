name: pages

# The site: a landing page and the dashboard demo, built from the code on main
# by scripts/build-site.mjs. The demo is the real page answering from a
# product that does not exist, so it is rebuilt with every change to main
# rather than kept as a copy that drifts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # deploy-pages proves which workflow made the site with this

# One deployment at a time, and a newer push wins over one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No install step: the site is built with what the package already is.
      - run: node scripts/build-site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
